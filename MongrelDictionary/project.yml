name: MongrelDictionary
options:
  bundleIdPrefix: com.mongrel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

schemes:
  MongrelDictionary:
    build:
      targets:
        MongrelDictionaryCore: all
        MongrelDictionary: all
        MongrelDictionaryTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: MongrelDictionaryTests

targets:
  MongrelDictionaryCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: App/Core
      - path: App/Services
      - path: App/Data/OfflineArchives
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.dictionary.core
        PRODUCT_NAME: MongrelDictionaryCore
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        EXCLUDED_ARCHS[sdk=macosx*]: ""
        ARCHS: "$(ARCHS_STANDARD)"

  MongrelDictionary:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: App
        excludes:
          - Core
          - Data
          - Services

    dependencies:
      - target: MongrelDictionaryCore

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.dictionary
        PRODUCT_NAME: MongrelDictionary
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: App/MongrelDictionary.entitlements
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mongrel Dictionary
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mongrel"
        MARKETING_VERSION: 0.9.0
        CURRENT_PROJECT_VERSION: 2026092405
        SWIFT_STRICT_CONCURRENCY: complete
        EXCLUDED_ARCHS[sdk=macosx*]: ""
        ARCHS: "$(ARCHS_STANDARD)"

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES
          STRIP_INSTALLED_PRODUCT: YES

  MongrelDictionaryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Tests
      - path: App/ViewModels/DictionarySession.swift

    dependencies:
      - target: MongrelDictionaryCore

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mongrel.dictionary.tests
        PRODUCT_NAME: MongrelDictionaryTests
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: 14.0
        GENERATE_INFOPLIST_FILE: YES
